spring:
  application:
    name: scentify-backend
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/scentify}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://securetoken.google.com/${GOOGLE_CLOUD_PROJECT_ID:localhost}}
server:
  port: ${PORT:8080}

CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
